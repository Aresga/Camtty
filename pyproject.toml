[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "camtty"
version = "0.1.0"
description = "A CLI tool to display webcam feed as ASCII art in the terminal"
authors = [
    {name = "Abderrahman Gaga", email = "agaga@student.hive.fi"},
]
keywords = [
	"webcam",
	"ascii-art",
	"terminal",
	"cli",
	"video",
	"camera",
	"ascii",
	"tty"
]
requires-python = ">=3.7"
dependencies = [
    "opencv-python",
    "numpy",
]

[project.scripts]
camtty = "camtty.cam_to_ascii:main"

[tool.setuptools]
packages = ["camtty"]
package-dir = {"" = "src"}